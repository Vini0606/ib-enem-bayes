[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ib_enem_bayes"
version = "0.0.1"
description = "Regressao linear bayesiana Normal-Gama vs EMV - nota de Matematica no ENEM"
authors = [
  { name = "Vinicius de Paula Ribeiro" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.11"


[tool.ruff]
line-length = 99
src = ["ib_enem_bayes"]
include = ["pyproject.toml", "ib_enem_bayes/**/*.py"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ib_enem_bayes"]
force-sort-within-sections = true

